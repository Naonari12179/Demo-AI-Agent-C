name: TMAS Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # PRコメント投稿に必要

jobs:
  tmas-scan:
    name: TMAS Repo Scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo-name

      - name: TMAS Scan
        uses: trendmicro/tmas-scan-action@v3.1.3
        with:
          version: '3'              # メジャー固定推奨（3.x.x の最新を自動追従）
          vulnerabilitiesScan: true
          malwareScan: false        # ソースツリーには非対応
          secretsScan: true
          artifact: dir:./repo-name
          additionalArgs: --region=ap-northeast-1
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
